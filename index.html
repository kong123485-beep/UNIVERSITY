:root {
  --surface: #f8f9fa;
  --page: #ffffff;
  --ink: #111827;
  --muted: #4b5563;
  --soft: #6b7280;
  --faint: #9ca3af;
  --line: #eceef1;
  --line-2: #f1f2f4;
  --card: #ffffff;
  --pill: #f8f9fa;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #0b0f14;
    --page: #111827;
    --ink: #f3f4f6;
    --muted: #cbd5e1;
    --soft: #9ca3af;
    --faint: #6b7280;
    --line: #26303a;
    --line-2: #1f2937;
    --card: #151c25;
    --pill: #1d2733;
  }
}

* {
  font-family: "Noto Sans TC", "Inter", sans-serif;
  box-sizing: border-box;
}

html, body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
}

body {
  min-width: 0;
}

a {
  color: inherit;
}

.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding: 32px 24px 48px;
  width: 100%;
}

.header {
  text-align: center;
  max-width: 720px;
  margin: 0 auto;
}

.header h1 {
  font-size: 42px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 0.95;
  margin: 0;
}

.header p {
  color: var(--muted);
  margin-top: 12px;
}

.grid {
  margin-top: 48px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

@media (max-width: 900px) {
  .grid {
    grid-template-columns: 1fr;
  }

  .header h1 {
    font-size: 28px;
  }
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 24px;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  transition: transform .28s cubic-bezier(.16,1,.3,1), box-shadow .28s cubic-bezier(.16,1,.3,1);
  box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 4px 16px rgba(0,0,0,.03);
  min-width: 0;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 24px -8px rgba(0,0,0,.12);
}

.card:focus-visible, .quick-select:focus-visible {
  outline: 3px solid #0ea5e9;
  outline-offset: 3px;
}

.card-top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
}

.card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  gap: 12px;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 999px;
  flex: 0 0 auto;
}

.arrow {
  width: 28px;
  height: 28px;
  border-radius: 999px;
  background: var(--pill);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--faint);
  flex: 0 0 auto;
}

.icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: var(--pill);
  border: 1px solid var(--line-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  margin-bottom: 16px;
}

.card h2 {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.35;
  margin: 0;
  min-height: 48px;
}

.sub {
  margin-top: 8px;
  font-size: 13px;
  color: var(--soft);
}

.desc {
  margin-top: 8px;
  font-size: 12.5px;
  color: var(--faint);
  line-height: 1.5;
}

.file-pill {
  margin-top: auto;
  padding-top: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--pill);
  border-radius: 999px;
  padding: 8px 12px;
  border: 1px solid var(--line-2);
  margin-top: 20px;
  min-width: 0;
}

.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: var(--soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #111827;
  color: #fff;
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 11px;
}

.repo {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  font-size: 12px;
  margin-bottom: 24px;
}

.quick-select {
  margin-top: 8px;
  width: 100%;
  max-width: 380px;
  border: 1px solid #e5e7eb;
  border-radius: 999px;
  padding: 12px 16px;
  font-size: 14px;
  background: var(--card);
  color: var(--ink);
}

@media (max-width: 480px) {
  .wrap {
    padding-left: 16px;
    padding-right: 16px;
  }

  .repo {
    padding: 12px;
  }

  .badge {
    margin-left: 0 !important;
  }
}
</style>
